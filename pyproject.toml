[project]
name = "ringer"
version = "0.1.0"
description = "Router-judge multi-agent harness on Claude Fable/Opus (planner+judge) and Sonnet/Haiku (workers)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.68.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
ringer = "ringer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ringer*"]
